server:
  port: 8080

spring:
  application:
    name: launcher-demo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/zhiling_launcher?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

dingtalk:
  docs:
    endpoint: ${DINGTALK_DOCS_ENDPOINT:http://192.168.77.53:8001/api/docs/list}
    # 本地联调默认值；部署环境请通过 DINGTALK_APP_KEY / DINGTALK_APP_SECRET 覆盖。
    app-key: ${DINGTALK_APP_KEY:dingb92lqkmruhdjecej}
    app-secret: ${DINGTALK_APP_SECRET:aw4y9RLZbSZvqFZWvBopZWcvS0XZ06F5Cm6peQiB8UkVzf4SrFzu5Y4EER5ijmui}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

launcher:
  step-delay-ms: 850
  skill-upload:
    # 默认使用 Playwright 真实上传；需要本地编排测试时显式设置为 mock。
    mode: ${LAUNCHER_SKILL_UPLOAD_MODE:playwright}
    node-command: ${LAUNCHER_NODE_COMMAND:node}
    worker-script: ${LAUNCHER_SKILL_WORKER:automation/upload-agent-skills.mjs}
    package-directory: ${LAUNCHER_SKILL_PACKAGE_DIR:skills}
    timeout-seconds: ${LAUNCHER_SKILL_UPLOAD_TIMEOUT_SECONDS:120}
  agent-initialization:
    # 与管理员上传独立配置，避免开启用户侧自动化时改变原有上传行为。
    # 默认使用 Playwright 真实初始化；需要本地编排测试时显式设置为 mock。
    mode: ${LAUNCHER_AGENT_INITIALIZATION_MODE:playwright}
    node-command: ${LAUNCHER_NODE_COMMAND:node}
    worker-script: ${LAUNCHER_AGENT_INITIALIZATION_WORKER:automation/initialize-doubao-agent.mjs}
    timeout-seconds: ${LAUNCHER_AGENT_INITIALIZATION_TIMEOUT_SECONDS:120}
